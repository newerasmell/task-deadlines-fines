# Render Blueprint for PricePilot. This repo also hosts an unrelated app
# (TODF) at its root, so this file lives at pricepilot/render.yaml rather
# than the repo root — when creating the Blueprint in the Render dashboard,
# point it at this path explicitly (Manual setup in the README is simpler
# for a single service and doesn't require that step at all).
services:
  - type: web
    name: pricepilot
    runtime: node
    plan: starter # persistent disks require a paid plan, not Free
    rootDir: pricepilot
    # --include=dev is required here: NODE_ENV=production is set below (for
    # correct runtime behavior — secure cookies etc.) but that same env var
    # is visible during the build too, and npm's default under
    # NODE_ENV=production is to skip devDependencies — which is exactly
    # where typescript, @types/*, prisma, and vite all live. Without this
    # flag the build fails with "Cannot find name 'console'" and similar,
    # because @types/node etc. silently never got installed.
    # `npx playwright install chromium chromium-headless-shell` downloads the
    # actual browser binaries the `playwright` npm package (installed above)
    # needs at runtime — chromium.launch({headless:true}) resolves to the
    # separate "headless shell" build, not the regular Chromium download.
    # Confirmed live: the build log shows both downloading to 100% and
    # landing at /opt/render/.cache/ms-playwright/..., yet the running
    # server still can't find them there — Render's build and runtime
    # environments don't share that cache directory, it's build-only and
    # gone before the app actually starts. PLAYWRIGHT_BROWSERS_PATH=0 below
    # (also set as a runtime env var — both matter, install-time AND
    # launch-time need to agree on the path) redirects the install into
    # node_modules/playwright-core/.local-browsers instead, which — unlike
    # an external cache dir — is guaranteed to carry over into the running
    # container since it's part of the actual deployed app. Deliberately
    # omitting --with-deps: it also apt-get-installs a long list of system
    # libraries, a much bigger/riskier build step that could fail outright
    # depending on what the build image allows — if the deploy log shows a
    # missing-shared-library error at *runtime* instead, add --with-deps and
    # accept that tradeoff.
    buildCommand: >
      cd server && npm install --include=dev && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --force chromium chromium-headless-shell && npx prisma generate && npm run build &&
      cd ../web && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: NO_COST_FLOOR_PCT
        value: "0.7"
      - key: SHOPIFY_API_VERSION
        value: "2025-01"
      - key: DATABASE_URL
        value: file:/data/pricepilot.db
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0" # must match at both install time (buildCommand) and launch time (here)
      # CORS_ORIGIN intentionally left unset: in production the same Express
      # process serves both the API and the built frontend (same origin), so
      # no cross-origin requests ever happen and the setting is moot.
    disk:
      name: pricepilot-data
      mountPath: /data
      sizeGB: 1
