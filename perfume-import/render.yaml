# Render Blueprint: one web service (API + built app, Docker) and a managed Postgres.
# This project lives in perfume-import/ of a repo that also hosts other apps, so the Blueprint path is
# perfume-import/render.yaml (set it explicitly when creating the Blueprint), and paths below are repo-relative.
# Secrets are never in this file. Keys marked `sync: false` are entered in the Render dashboard
# when the Blueprint is created (or later under Environment).
services:
  - type: web
    name: perfume-import
    runtime: docker
    plan: starter
    dockerContext: ./perfume-import
    dockerfilePath: ./perfume-import/Dockerfile
    buildFilter:
      paths:
        - perfume-import/**
    healthCheckPath: /api/health
    # Finished and original pictures (SPEC §6). A disk survives deploys; it also means one instance and a short
    # stop on each deploy (Render does not do zero-downtime deploys for services with a disk).
    disk:
      name: perfume-media
      mountPath: /var/data/media
      sizeGB: 5
    envVars:
      - key: MEDIA_DIR
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: perfume-import-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SHOPIFY_TOKEN_PREMIERPARFUMS
        sync: false
      - key: SHOPIFY_TOKEN_PARFEMIJA
        sync: false
      - key: SHOPIFY_TOKEN_PARFEM4U
        sync: false
      - key: SHOPIFY_TOKEN_LUXILLAT
        sync: false
      - key: SHOPIFY_TOKEN_SCENTELLAS
        sync: false
      - key: SHOPIFY_TOKEN_SENZAROMI
        sync: false
      - key: SHOPIFY_TOKEN_TVOJAPARFUM
        sync: false
      - key: SHOPIFY_TOKEN_AROMACHIC
        sync: false
      - key: SHOPIFY_TOKEN_FRAGRALUX
        sync: false
      - key: SHOPIFY_TOKEN_PERFEMIO
        sync: false
      - key: SHOPIFY_TOKEN_AROMIZO
        sync: false
      - key: SHOPIFY_TOKEN_FRAGRACY
        sync: false
      - key: SHOPIFY_TOKEN_LUXAROMI
        sync: false
      - key: SHOPIFY_TOKEN_LUXCENTIO
        sync: false
      - key: SHOPIFY_TOKEN_SCENTAORO
        sync: false
      - key: SHOPIFY_TOKEN_SCENTILOS
        sync: false
      - key: SHOPIFY_TOKEN_SCENTILUX
        sync: false
      - key: SHOPIFY_TOKEN_SCENTIVIO
        sync: false

databases:
  - name: perfume-import-db
    databaseName: perfume
    user: perfume
    plan: basic-256mb
    postgresMajorVersion: "16"
