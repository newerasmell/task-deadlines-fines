# Render Blueprint: one web service (API + built app, Docker) and a managed Postgres.
# This project lives in perfume-import/ of a repo that also hosts other apps, so the Blueprint path is
# perfume-import/render.yaml (set it explicitly when creating the Blueprint), and paths below are repo-relative.
# Secrets are never in this file. ANTHROPIC_API_KEY (`sync: false`) is entered in the Render dashboard when the
# Blueprint is created (or later under Environment).
services:
  - type: web
    name: perfume-import
    runtime: docker
    plan: starter
    region: frankfurt  # closest to the team; must match the database, chosen only at creation
    dockerContext: ./perfume-import
    dockerfilePath: ./perfume-import/Dockerfile
    buildFilter:
      paths:
        - perfume-import/**
    healthCheckPath: /api/health
    # Finished and original pictures (SPEC §6). A disk survives deploys; it also means one instance and a short
    # stop on each deploy (Render does not do zero-downtime deploys for services with a disk).
    disk:
      name: perfume-media
      mountPath: /var/data/media
      sizeGB: 5
    envVars:
      - key: MEDIA_DIR
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: perfume-import-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shopify access per store is added later under Environment (not asked at creation):
      # SHOPIFY_CLIENT_ID_<STORE> + SHOPIFY_CLIENT_SECRET_<STORE> from a Dev Dashboard app, or SHOPIFY_TOKEN_<STORE>
      # from an older custom app, e.g. SHOPIFY_CLIENT_ID_PARFEMIJA. See README "Качване в Shopify".

databases:
  - name: perfume-import-db
    databaseName: perfume
    user: perfume
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
