# Local Postgres for development and tests. Same credentials as .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: perfume
      POSTGRES_PASSWORD: perfume
      POSTGRES_DB: perfume
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfume -d perfume"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
